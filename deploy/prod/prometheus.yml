# Production scrape + alerting (DD-236). Metrics ports are on the internal
# network only; Prometheus itself listens on the host's loopback (SSH tunnel).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otter-api
    static_configs:
      - targets: ["api:9090"]
  - job_name: otter-worker
    static_configs:
      - targets: ["worker:9091"]
