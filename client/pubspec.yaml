name: otter
description: "Otter — persistent idle MMORPG client (mobile-first)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  stream_channel: ^2.1.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/items/ # item art: <template_code>.png (DD-240)
    - assets/animals/ # hunting animals: <animal>.png (wolf_pelt → wolf.png)
    - assets/classes/ # class portraits: <class_code>.png (DD-266)
    - assets/races/ # race portraits: <race_code>.png (DD-266)
    - assets/branding/ # MeNa World logo (DD-270)
