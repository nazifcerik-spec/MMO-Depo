<!DOCTYPE html>
<html lang="tr">
<head>
  <!-- Replaced by `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <title>MeNa World</title>
  <meta name="description" content="MeNa World: sen yokken de süren bir fantastik macera. Tarayıcıda oyna. An idle fantasy RPG that plays on while you are away.">
  <meta name="theme-color" content="#0F1013">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">

  <meta property="og:type" content="website">
  <meta property="og:title" content="MeNa World">
  <meta property="og:description" content="Sen yokken de süren maceralar. · Adventures that go on while you are away.">
  <meta property="og:image" content="icons/Icon-512.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MeNa World">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0F1013; overscroll-behavior: none; }
    /* Shown until Flutter draws its first frame. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 28px;
      align-items: center; justify-content: center; background: #0F1013;
      font: 14px system-ui, sans-serif; color: #A8ACB8; transition: opacity .25s;
    }
    #splash img { width: 144px; height: 144px; }
    #splash .bar { width: 180px; height: 4px; border-radius: 2px; background: #2E3240; overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #E4A756; animation: slide 1.2s ease-in-out infinite; }
    #splash p { margin: 0 24px; text-align: center; max-width: 420px; }
    @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar i { animation-duration: 4s; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="MeNa World">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"><i></i></div>
    <p id="splash-note"></p>
    <noscript><p>MeNa World için JavaScript gerekir. · MeNa World needs JavaScript.</p></noscript>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('splash');
      var slow = setTimeout(function () {
        document.getElementById('splash-note').textContent =
          'Yükleme uzun sürdü. Bağlantını kontrol edip sayfayı yenile. · Loading is slow. Check your connection and reload.';
      }, 45000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(slow);
        splash.style.opacity = 0;
        setTimeout(function () { splash.remove(); }, 300);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
