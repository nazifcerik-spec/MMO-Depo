# Render Blueprint — free single-process hosting (DD-239).
#
#   Database: Supabase (free), session pooler URI in DATABASE_URL (set in the
#   Render dashboard; never committed).
#   API: Render free web service. It applies the embedded migrations at start
#   and runs the worker jobs in-process (Render has no free background worker).
#   Redis: Render free Key Value, internal only (rate limits; nothing durable).
#
# Free-tier limits: the API sleeps after 15 min without traffic (first request
# then waits ~50 s; worker jobs pause and catch up on wake), 512 MB / 0.1 CPU.
# Paid production keeps deploy/prod (separate worker, backups, monitoring).
services:
  - type: web
    name: new-world-mmo-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/api.Dockerfile
    dockerContext: .
    healthCheckPath: /live
    autoDeploy: true
    envVars:
      - key: ENV
        value: prod
      - key: PORT # the port Render routes to; the API listens on HTTP_ADDR
        value: "8080"
      - key: HTTP_ADDR
        value: ":8080"
      - key: DATABASE_URL # Supabase → Connect → Session pooler URI (+ ?sslmode=require)
        sync: false
      - key: DATABASE_MAX_CONNS # Supabase free session pooler: keep well under its pool size
        value: "8"
      - key: MIGRATE_ON_START
        value: "true"
      - key: RUN_WORKER
        value: "true"
      - key: JWT_PRIVATE_KEY_SEED # Ed25519 seed for access tokens; Render generates it once
        generateValue: true
      - key: REDIS_ADDR # redis:// connection string (platform/redis accepts URLs)
        fromService:
          type: keyvalue
          name: new-world-mmo-redis
          property: connectionString
      - key: AUTH_HASH_CONCURRENCY # 0.1 CPU: two argon2id runs at a time (19 MiB each)
        value: "2"
      # Chain: player → Cloudflare (Render's CDN) → Render edge on loopback → app;
      # health checks come from 10.x. Trusting these hops lets RealIP take the
      # first untrusted X-Forwarded-For entry — the player (DD-225, DD-239).
      # Cloudflare ranges: https://www.cloudflare.com/ips/ (re-check yearly).
      - key: TRUSTED_PROXIES
        value: "::1/128,127.0.0.0/8,10.0.0.0/8,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - key: PUBLIC_BASE_URL # https://<service>.onrender.com — links in e-mails and policy pages
        sync: false
      # E-mail (DD-247): Render's free plan blocks outbound SMTP ports, so mail
      # goes through Brevo's HTTPS API. MAIL_FROM = a sender verified in Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: LOG_LEVEL
        value: info

  - type: keyvalue
    name: new-world-mmo-redis
    plan: free
    region: frankfurt
    ipAllowList: [] # internal connections only
    maxmemoryPolicy: allkeys-lru
