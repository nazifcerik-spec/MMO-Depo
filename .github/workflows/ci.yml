# Otter CI (Sprint 32, DD-216). Runs on every push and pull request.
#   server       gofmt + vet + race tests
#   migrations   every migration up → down → up on real Postgres, then unit +
#                integration tests together and the per-package coverage
#                ratchet on their merged profile (DD-223)
#   client       format + analyze + widget/unit tests + coverage gate
#   lint         staticcheck (server, incl. integration tests) (DD-237)
#   alerts       Prometheus rule syntax + rule unit tests + prod config (DD-236)
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x" # latest patch: stdlib security fixes (DD-237)
          check-latest: true
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./... && go vet -tags integration ./internal/integration/
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: vulnerabilities (reachable only)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # staticcheck v0.8.1 cannot read Go 1.27 export data yet; lint
          # results do not depend on the patch level. Move to 1.27.x once it can.
          go-version: "1.26.x"
          cache-dependency-path: server/go.sum
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -tags integration ./internal/integration/

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: otter
          POSTGRES_PASSWORD: otter
          POSTGRES_DB: otter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U otter -d otter"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Throwaway CI database; not a secret.
      DATABASE_URL: postgres://otter:otter@localhost:5432/otter?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: migrate up → down → up
        run: |
          migrate() {
            docker run --rm --network host -v "$PWD/server/migrations:/migrations:ro" \
              migrate/migrate:v4.17.0 -path=/migrations -database "$DATABASE_URL" "$@"
          }
          migrate up
          migrate down -all
          migrate up
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x" # latest patch: stdlib security fixes (DD-237)
          check-latest: true
          cache-dependency-path: server/go.sum
      - name: unit + integration tests (merged coverage)
        working-directory: server
        run: go test -tags integration -count=1 -coverpkg=./... -coverprofile=../cover.out ./...
      - name: coverage gate
        working-directory: server
        run: sh ../scripts/coverage_gate.sh profile coverage-thresholds.txt ../cover.out

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: format (generated l10n excluded)
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' ! -path 'lib/l10n/*')
      - run: flutter analyze
      - run: flutter test --coverage
      - name: coverage gate
        run: sh ../scripts/coverage_gate.sh lcov coverage/lcov.info 80

  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-alerts.sh deploy/prod/alertmanager.yml.example
