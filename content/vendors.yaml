# Otter — Vendor Template Catalog (Sprint 12)
#
# Alan sözleşmesi:
#   code               PK, snake_case
#   display_name_key   i18n key
#   vendor_type        general | weapon | armor | alchemy | craft_supply
#   buy_multiplier     vendor→player fiyat çarpanı (default 1.000)
#   sell_multiplier    player→vendor fiyat çarpanı (DD-139 default 0.250)
#   sells              satılan template listesi. Boş [] => sadece alıcı.
#     - template_code:            item_template.code (var olması zorunlu)
#       price_override_copper:    opsiyonel (default: base × buy_mult)

vendors:
  - code: general_ironhold
    display_name_key: vendor.general_ironhold
    vendor_type: general
    buy_multiplier: 1.000
    sell_multiplier: 0.250
    sells:
      - { template_code: potion_hp_small }
      - { template_code: potion_hp_medium }
      - { template_code: potion_hp_large }
      - { template_code: sword_training }
      - { template_code: staff_willow }
      - { template_code: bow_short }
      - { template_code: mace_wooden }
      - { template_code: dagger_rusty }
      - { template_code: totem_carved }
      - { template_code: lute_simple }
      - { template_code: sickle_bronze }
      - { template_code: hammer_oak }
      - { template_code: fist_wraps }
      - { template_code: helm_leather }
      - { template_code: chest_leather }
      - { template_code: legs_leather }
      - { template_code: boots_leather }
      - { template_code: gloves_leather }
