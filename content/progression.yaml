# Character progression (DD-250): XP curve, level reward rules, class
# promotion tree, talent trees. Skill unlocks per class node live in
# skills.yaml (spec + unlock_level). Loaded by contentpack and installed into
# the leveling engine; nothing here is hardcoded in gameplay code.

level_cap: 1000

# minutes(L) = a + b·L^c ; xp(L→L+1) = ceil(minutes × baseline).
# kind: table + table: [ ... 999 values ... ] replaces the formula.
xp_curve:
  kind: formula
  baseline_xp_per_minute: 1000
  a: 3.75006670
  b: 0.00121846427
  c: 1.69337967

xp_multiplier: 1.0            # global XP modifier (events can raise it later)
afk_combat_xp_per_minute: 1000 # AFK hunts/dungeons pay this per minute of fighting

attribute_points:
  every: 2
  amount: 1
  milestones: { 100: 5, 300: 5, 600: 5, 850: 5, 1000: 5 }   # 500 + 25 = 525

talent_points: { from: 100, every: 20, until: 980, amount: 1 } # 45 total
talent_tree_points: 25

titles:
  100: veteran
  200: elite
  300: champion
  400: hero
  500: legendary
  600: mythic
  700: ancient
  800: ascendant
  900: immortal
  1000: eternal

milestones: { awakening: 600, ultimate: 700, capstone: 850, mastery: 1000 }

# Raw attribute points count at decreasing effectiveness (combat scaling only;
# requirements use raw values).
attribute_scaling:
  - { up_to: 100, effectiveness: 1.0 }
  - { up_to: 250, effectiveness: 0.8 }
  - { up_to: 400, effectiveness: 0.55 }
  - { up_to: 0,   effectiveness: 0.35 }

caps: { crit_pct: 60, evasion_pct: 40, block_pct: 60, dmg_reduction_pct: 75, hit_pct: 100 }

# Equipment families (item subclasses) that class permissions govern, and
# armor types (permission "<type>_armor"). Items whose subclass is not a
# family (helm, ring, ...) are usable by everyone (DD-252).
equipment_families:
  [sword, axe, mace, greatsword, greataxe, spear, shield,
   dagger, short_sword, dual_dagger, fist_weapon, throwing_knife,
   bow, longbow, crossbow, short_spear,
   staff, wand, orb, grimoire, tonfa, unarmed, holy_tome, two_handed_mace,
   sickle, nature_focus, lute, harp, flute, rapier, ritual_axe, totem_focus]
armor_types: [cloth, light, medium, heavy]

# Combat XP from mobs below the character's level (DD-254): full within 10
# levels, half up to 25 below, a tenth beyond. Mobs at or above the
# character always pay in full.
mob_level_xp:
  - { max_below: 10, factor: 1.0 }
  - { max_below: 25, factor: 0.5 }
  - { max_below: 0,  factor: 0.1 }

# Support specializations without a party convert this share of their
# support_power into attack (Solo Adaptation, DD-252).
solo_adaptation: { ratio: 0.35 }

classes:
  - code: warrior
    name_key: class.warrior
    role_tags: [tank, melee_dps, bruiser]
    resource: { kind: rage, max: 100, start_pct: 0, per_hit: 12, per_turn: 0 }
    base_stats: { strength: 10, vitality: 10, dexterity: 7, intelligence: 4, wisdom: 5, luck: 5 }
    # Reference formulas (DD-250 §12). Bases and per-level terms (not in the
    # reference) are tuned by the balance simulation (internal/balance): with
    # allocatable points instead of automatic growth, Warrior still meets the
    # hunt/dungeon targets of the level-1..25 content.
    derived:
      hp:     { base: 150, per_level: 16, per: { vitality: 18 } }
      attack: { base: 15, per_level: 4.0, per: { strength: 2.2, dexterity: 0.4 } }
      armor:  { base: 8, per_level: 1.8, per: { vitality: 1.2 } }
      crit:   { base: 5, per: { dexterity: 0.05 } }
      hit:    { base: 90, per: { dexterity: 0.5 } }
      dodge:  { per: { dexterity: 0.04 } }
      block:  { per: { strength: 0.03 } }
    primary_attribute: strength
    secondary_attributes: [vitality]
    equipment_permissions: [heavy_armor, sword, axe, mace, greatsword, greataxe, spear, shield]

