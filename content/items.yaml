# Otter — Item Template Catalog (Sprint 12)
#
# Bu dosya server başlatıldığında content-pack loader tarafından okunur ve
# content.item_template tablosuna UPSERT edilir. Migration seed baseline; bu
# dosya authoritative source of truth.
#
# Alan sözleşmesi:
#   code               PK, snake_case, immutable (rename => new code)
#   display_name_key   i18n key (translations layer sprint 21+)
#   item_class         weapon | armor | consumable | material | misc
#   item_subclass      alt tip (sword, ore, potion, ...)
#   min_level          equip/use için minimum karakter seviyesi
#   base_value_copper  vendor sell reference (× vendor.sell_multiplier)
#   base_weight_g      envanter ağırlık cap'ine katkı (Sprint 9)
#   stackable          true => aynı slot'ta birikir
#   max_stack          stackable => max miktar
#   bind_kind          boe | bop | boa
#   affixable          true => rare+ item roll'unda prefix/suffix alır
#   equip_slot         opsiyonel: mainhand | offhand | helm | chest | legs | boots | gloves | necklace | ring1 | ring2 | trinket1 | trinket2 (inventory.KnownEquipSlots)
#   class_restriction  opsiyonel: yalnızca bu class equip edebilir
#   use_effect         opsiyonel, yalnız consumable: { kind: heal_hp, amount: N } (DD-218)
#   stat_bonuses       equip'te uygulanan modifier stack (DD-107)
#     - kind:   flat | mult_add | mult_prod | clamp_min | clamp_max | set
#       target: str | agi | int | vit | cha | luck | attack | defense | crit_pct | hit_pct | hp_max | mp_max | energy_max | stamina_max
#       amount: sayı (flat=int, mult=oran örn 0.10, clamp/set=int)

