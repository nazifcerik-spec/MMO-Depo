pet.autumn_stag.habitat: "Осенние леса"
pet.autumn_stag.story: "Дух падающих листьев. Где бы он ни прошёл, лес становится красным и золотым."
pet.bone_dragon: "Костяной дракон"
pet.bone_dragon.creature: "Дракон-скелет"
pet.bone_dragon.habitat: "Забытые поля сражений"
pet.bone_dragon.story: "Древний дракон, восставший из собственных костей. Он может поднять павших воинов, чтобы те сражались рядом с ним."
pet.chaos_hydra: "Гидра хаоса"
pet.chaos_hydra.creature: "Гидра"
pet.chaos_hydra.habitat: "Разрушенные храмы на Краю вечности"
pet.chaos_hydra.story: "Многоголовое существо, рождённое там, где кончается мир. Каждая голова питается своим ветром хаоса, а связанная с хозяином гидра бьёт врагов сразу с нескольких сторон."
pet.cloud_sheep: "Облачная овца"
pet.cloud_sheep.creature: "Овца"
pet.cloud_sheep.habitat: "Парящие небесные острова"
pet.cloud_sheep.story: "Её шерсть — настоящее облако, мягкое и лёгкое. В тихие дни она парит над лугами."
pet.coral_snake: "Коралловая змея"
pet.coral_snake.creature: "Змея"
pet.coral_snake.habitat: "Глубокие рифы и затонувшие руины"
pet.coral_snake.story: "Змея с коралловым узором, охраняющая затонувшие сокровища. Её кольца тверды, как сам риф."
pet.cosmic_whale: "Космический кит"
pet.cosmic_whale.creature: "Кит"
pet.cosmic_whale.habitat: "Звёздное море среди облаков"
pet.cosmic_whale.story: "Кроткий гигант, плывущий по ночному небу. Звёзды липнут к его коже, как сверкающие пузырьки."
pet.crimson_lion: "Багровый лев"
pet.crimson_lion.creature: "Лев"
pet.crimson_lion.habitat: "Золотые саванны"
pet.crimson_lion.story: "Гордый лев с гривой цвета заката. Его рык придаёт храбрости всем союзникам рядом."
pet.crystal_cat: "Хрустальная кошка"
pet.crystal_cat.creature: "Кошка"
pet.crystal_cat.habitat: "Хрустальные пещеры"
pet.crystal_cat.story: "Любопытная кошка с телом из прозрачного кристалла. Свет преломляется в ней, и кажется, что она сразу в двух местах."
pet.deluge_shark: "Акула потопа"
pet.deluge_shark.creature: "Акула"
pet.deluge_shark.habitat: "Открытые штормовые моря"
pet.deluge_shark.story: "Она плывёт внутри самого шторма, оседлав гигантские волны. Корабли дрожат, когда её плавник рассекает воду."
pet.diamond_beetle: "Алмазный жук"
pet.diamond_beetle.creature: "Жук-носорог"
pet.diamond_beetle.habitat: "Самоцветные шахты"
pet.diamond_beetle.story: "Его панцирь — один безупречный алмаз. Он прогрызает камень, питаясь найденными самоцветами."
pet.ember_hyena: "Угольная гиена"
pet.ember_hyena.creature: "Гиена"
pet.ember_hyena.habitat: "Выжженные равнины и пепельные поля"
pet.ember_hyena.story: "Она смеётся, пока вокруг горит трава. Вдоль её хребта тлеют угли."
pet.emerald_peacock: "Изумрудный павлин"
pet.emerald_peacock.creature: "Павлин"
pet.emerald_peacock.habitat: "Королевские сады и храмы джунглей"
pet.emerald_peacock.story: "Когда он раскрывает изумрудный хвост, вокруг распускаются цветы. Короли когда-то держали его как знак удачи."
pet.fairy_firefly: "Волшебный светлячок"
pet.fairy_firefly.creature: "Фея-светлячок"
pet.fairy_firefly.habitat: "Зачарованные ночные леса"
pet.fairy_firefly.story: "Крошечная фея, светящаяся как светлячок. Там, где она танцует, самая тёмная ночь становится мягкой."
pet.flame_salamander: "Пламенная саламандра"
pet.flame_salamander.creature: "Саламандра"
pet.flame_salamander.habitat: "Огонь кузниц и лавовые трубы"
pet.flame_salamander.story: "Кузнецы говорят, что горн горит лучше всего, когда в нём спит саламандра. Ей никогда не холодно, даже зимой."
pet.flamewing: "Огнекрыл"
pet.flamewing.creature: "Птица вроде феникса"
pet.flamewing.habitat: "Края вулканов и угольные небеса"
pet.flamewing.story: "Маленькая огненная птица, которая не перестаёт светиться. Когда она вырастает, за её крыльями тянется след из искр."
pet.frostwolf: "Морозный волк"
pet.frostwolf.creature: "Волк"
pet.frostwolf.habitat: "Мёрзлая тундра и снежные леса"
pet.frostwolf.story: "Верный охотник стаи, чьё дыхание становится инеем. Он выслеживает добычу на мили сквозь метель."
pet.gale_owl: "Сова ветров"
pet.gale_owl.creature: "Сова"
pet.gale_owl.habitat: "Ветреные скалы и высокие башни"
pet.gale_owl.story: "Мудрая сова, бесшумно скользящая на ветру. Она видит ход врага раньше, чем тот его сделает."
pet.glass_jellyfish: "Стеклянная медуза"
pet.glass_jellyfish.creature: "Медуза"
pet.glass_jellyfish.habitat: "Лагуны под луной"
pet.glass_jellyfish.story: "Почти невидимая в воде, она плывёт как стеклянный фонарь. Её касание лечит друзей и жалит врагов."
pet.graveyard_owl: "Кладбищенская сова"
pet.graveyard_owl.creature: "Сова"
pet.graveyard_owl.habitat: "Старые кладбища"
pet.graveyard_owl.story: "Она присматривает за покоящимися мёртвыми. Её бирюзовые глаза видят духов, незримых для других."
pet.iron_bull: "Железный бык"
pet.iron_bull.creature: "Бык"
pet.iron_bull.habitat: "Горные шахты и кузницы"
pet.iron_bull.story: "Бык со шкурой из живого железа. Если он начал разбег, ни одни ворота королевства его не остановят."
pet.lava_crab: "Лавовый краб"
pet.lava_crab.creature: "Краб"
pet.lava_crab.habitat: "Лавовые берега и горячие источники"
pet.lava_crab.story: "Его панцирь — остывшая лава, а клешни всё ещё светятся красным. Он с радостью купается там, где никто не выживет."
pet.light_stag: "Светлый олень"
pet.light_stag.creature: "Олень"
pet.light_stag.habitat: "Солнечные поляны и святые рощи"
pet.light_stag.story: "Сияющий олень с рогами, горящими как рассвет. Заблудившиеся странники идут за его светом на безопасные тропы."
pet.mossback: "Мшистая спина"
pet.mossback.creature: "Черепаха с деревом на спине"
pet.mossback.habitat: "Старые леса и мшистые берега рек"
pet.mossback.story: "Терпеливая черепаха с живым деревом на панцире. В его ветвях гнездятся птицы, пока она медленно бредёт по лесу."
pet.mushroom_squirrel: "Грибная белка"
pet.mushroom_squirrel.creature: "Белка"
pet.mushroom_squirrel.habitat: "Грибные леса"
pet.mushroom_squirrel.story: "Крошечная белка, на хвосте которой растут грибы. Она прячет семена повсюду и забывает половину."
pet.night_bat: "Ночная летучая мышь"
pet.night_bat.creature: "Летучая мышь"
pet.night_bat.habitat: "Глубокие пещеры"
pet.night_bat.story: "Безмолвный охотник ночного неба. Она слышит биение сердца с другого конца пещеры."
pet.obsidian_frog: "Обсидиановая лягушка"
pet.obsidian_frog.creature: "Лягушка"
pet.obsidian_frog.habitat: "Вулканические озёра"
pet.obsidian_frog.story: "Лягушка из чёрного вулканического стекла с огненными жилами. Она прыгает между лавовыми озёрами, не обжигаясь."
pet.rainbow_parrot: "Радужный попугай"
pet.rainbow_parrot.creature: "Попугай"
pet.rainbow_parrot.habitat: "Тропические кроны"
pet.rainbow_parrot.story: "Болтливый попугай, в чьих перьях все цвета неба. Он повторяет любой услышанный звук."
pet.rune_golem: "Рунный голем"
pet.rune_golem.creature: "Каменный голем"
pet.rune_golem.habitat: "Древние башни чародеев"
pet.rune_golem.story: "Высеченный забытыми магами, он просыпается, когда его руны загораются синим. Он слушается только тех, кому доверяет."
pet.rust_wolf: "Ржавый механический волк"
pet.rust_wolf.creature: "Механический волк"
pet.rust_wolf.habitat: "Заброшенные мастерские"
pet.rust_wolf.story: "Заводной волк, созданный пропавшим изобретателем. Его покрывает ржавчина, но шестерни всё ещё верно вращаются."
pet.sand_drake: "Песчаный дрейк"
pet.sand_drake.creature: "Дракон-ящер"
pet.sand_drake.habitat: "Моря дюн и пустынные каньоны"
pet.sand_drake.story: "Любящий солнце дрейк, плавающий в песке как в воде. Его бронзовая чешуя отводит клинки."
pet.sand_tiger: "Песчаный тигр"
pet.sand_tiger.creature: "Тигр"
pet.sand_tiger.habitat: "Пустынные руины"
pet.sand_tiger.story: "Его полосатая шкура сливается с дюнами. Он ждёт часами, а затем бьёт одним прыжком."
pet.sea_horn: "Морской рог"
pet.sea_horn.creature: "Морской конёк-дракон"
pet.sea_horn.habitat: "Коралловые рифы и тёплые отмели"
pet.sea_horn.story: "Изящный морской дракон со спиральным рогом. Моряки говорят, что его песнь усмиряет самые бурные волны."
pet.seal_dragon: "Запечатанный дракон"
pet.seal_dragon.creature: "Восточный дракон"
pet.seal_dragon.habitat: "Запечатанные горные святилища"
pet.seal_dragon.story: "Когда-то скованный тысячей печатей, теперь он служит тем, кто достоин их сломать."
pet.shadefox: "Теневая лиса"
pet.shadefox.creature: "Лиса"
pet.shadefox.habitat: "Безлунные леса и старые руины"
pet.shadefox.story: "Хитрая лиса, скользящая между тенями. Путники замечают её, когда она уже исчезла."
pet.silvermoon_hare: "Заяц серебряной луны"
pet.silvermoon_hare.creature: "Заяц"
pet.silvermoon_hare.habitat: "Луга под луной"
pet.silvermoon_hare.story: "Быстрый заяц, появляющийся только в полнолуние. Говорят, его серебряный мех приносит хозяину удачу."
pet.snow_panda: "Снежная панда"
pet.snow_panda.creature: "Панда"
pet.snow_panda.habitat: "Заснеженные бамбуковые горы"
pet.snow_panda.story: "Сонная панда с ледяной шерстью. Она добра, но её мёрзлые лапы бьют как падающие ледники."
pet.spark_hamster: "Искристый хомяк"
pet.spark_hamster.creature: "Хомяк"
pet.spark_hamster.habitat: "Крыши мастерских"
pet.spark_hamster.story: "Крошечный хомяк, полный статического электричества. Бегая по кругу, он может зажечь целый фонарь."
pet.spirit_monkey: "Духовная обезьяна"
pet.spirit_monkey.creature: "Обезьяна"
pet.spirit_monkey.habitat: "Туманные руины храмов"
pet.spirit_monkey.story: "Игривая обезьянка-призрак, ворующая и шляпы, и смех. От скуки она проходит сквозь стены."
pet.star_octopus: "Звёздный осьминог"
pet.star_octopus.creature: "Осьминог"
pet.star_octopus.habitat: "Глубокое море под звёздами"
pet.star_octopus.story: "В каждом его щупальце — крошечная галактика. Говорят, он упал с неба в давние времена."
pet.steel_scorpion: "Стальной скорпион"
pet.steel_scorpion.creature: "Скорпион"
pet.steel_scorpion.habitat: "Старые поля сражений и свалки"
pet.steel_scorpion.story: "Сложённый как доспех, он охотится среди ржавого оружия. Его хвост пробивает латы так же легко, как ткань."
pet.storm_eel: "Штормовой угорь"
pet.storm_eel.creature: "Угорь"
pet.storm_eel.habitat: "Штормовые заливы"
pet.storm_eel.story: "Он копит молнии в длинном теле и выпускает их ослепительными разрядами. Рыбаки избегают его вод."
pet.stormbird: "Штормовая птица"
pet.stormbird.creature: "Орёл"
pet.stormbird.habitat: "Громовые пики над облаками"
pet.stormbird.story: "Орёл, рождённый в грозу. Каждый взмах его крыльев трещит, а пикирует он как удар молнии."
pet.sun_scorpion: "Солнечный скорпион"
pet.sun_scorpion.creature: "Скорпион"
pet.sun_scorpion.habitat: "Солнечные храмы в пустыне"
pet.sun_scorpion.story: "Золотой скорпион, пьющий солнечный свет. В полдень его жало горит ярче огня."
pet.swamp_frog: "Болотная лягушка"
pet.swamp_frog.creature: "Лягушка"
pet.swamp_frog.habitat: "Мутные болота"
pet.swamp_frog.story: "Ленивая лягушка с очень острым языком. Её кожа выделяет яд, немеет всё, чего она коснётся."
pet.thorn_hedgehog: "Шипастый ёж"
pet.thorn_hedgehog.creature: "Ёж"
pet.thorn_hedgehog.habitat: "Каменистые холмы и заросли шипов"
pet.thorn_hedgehog.story: "Маленький, но храбрый, он сворачивается в шар из каменных шипов. Каждый, кто его ударит, пожалеет."
pet.time_caterpillar: "Гусеница времени"
pet.time_caterpillar.creature: "Гусеница-мотылёк"
pet.time_caterpillar.habitat: "Руины, где время застыло"
pet.time_caterpillar.story: "Он грызёт мгновения вместо листьев. Его кокон может замедлить время для всех вокруг."
pet.venom_moth: "Ядовитокрылая бабочка"
pet.venom_moth.creature: "Бабочка"
pet.venom_moth.habitat: "Сады ядовитых болот"
pet.venom_moth.story: "Прекрасная, но смертельная, её крылья рассеивают светящуюся пыль, ослабляющую любого врага, кто её вдохнёт."
pet.venom_spider: "Ядовитый паук"
pet.venom_spider.creature: "Паук"
pet.venom_spider.habitat: "Паутинные пещеры джунглей"
pet.venom_spider.story: "Он плетёт светящуюся паутину, ловящую даже крупных зверей. Один укус лишает добычу сил."
pet.wheat_boar: "Пшеничный кабан"
pet.wheat_boar.creature: "Кабан"
pet.wheat_boar.habitat: "Золотые нивы"
pet.wheat_boar.story: "Фермеры ему рады: поля, по которым он прошёл, растут вдвое выше. Его золотая щетина сияет в пору жатвы."

