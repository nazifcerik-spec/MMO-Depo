pet.iron_bull.creature: "雄牛"
pet.iron_bull.habitat: "山の鉱山と鍛冶場"
pet.iron_bull.story: "生きた鉄の皮を持つ雄牛。突進を始めれば、王国のどの門も止められません。"
pet.lava_crab: "溶岩ガニ"
pet.lava_crab.creature: "カニ"
