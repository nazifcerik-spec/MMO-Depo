pet.rune_golem: "ルーンゴーレム"
pet.rune_golem.creature: "石ゴーレム"
pet.rune_golem.habitat: "古代魔術師の塔"
pet.rune_golem.story: "忘れられた魔術師が彫り、ルーンが青く光ると目覚めます。信頼する者にのみ従います。"
pet.rust_wolf: "錆びた機械狼"
pet.rust_wolf.creature: "機械狼"
pet.rust_wolf.habitat: "打ち捨てられた工房"
pet.rust_wolf.story: "失踪した発明家が作ったぜんまい仕掛けの狼。錆に覆われても、歯車は忠実に回り続けます。"
pet.sand_drake: "砂ドレイク"
pet.sand_drake.creature: "竜トカゲ"
pet.sand_drake.habitat: "砂丘の海と砂漠の峡谷"
pet.sand_drake.story: "水のように砂を泳ぐ太陽好きのドレイク。青銅の鱗は刃をはね返します。"
pet.sand_tiger: "砂虎"
pet.sand_tiger.creature: "虎"
pet.sand_tiger.habitat: "砂漠の遺跡"
pet.sand_tiger.story: "縞模様の毛は砂丘に溶け込みます。何時間も待ち、ひと跳びで仕留めます。"
pet.sea_horn: "海角"
pet.sea_horn.creature: "タツノオトシゴ竜"
pet.sea_horn.habitat: "珊瑚礁と温かい浅瀬"
pet.sea_horn.story: "螺旋の角を持つ優雅な海竜。船乗りは、その歌が荒波を静めると言います。"
pet.seal_dragon: "封印竜"
pet.seal_dragon.creature: "東洋の竜"
pet.seal_dragon.habitat: "封印された山の祠"
pet.seal_dragon.story: "かつて千の封印に縛られ、今はそれを破るにふさわしい者に仕えます。"
pet.shadefox: "影狐"
pet.shadefox.creature: "狐"
pet.shadefox.habitat: "月なき森と古い遺跡"
pet.shadefox.story: "影の間をすり抜ける賢い狐。旅人が気づく時には、もう消えています。"
pet.silvermoon_hare: "銀月ウサギ"
pet.silvermoon_hare.creature: "ウサギ"
pet.silvermoon_hare.habitat: "月明かりの草原"
pet.silvermoon_hare.story: "満月にだけ現れる素早いウサギ。銀の毛は主に幸運をもたらすと言われます。"
pet.snow_panda: "雪パンダ"
pet.snow_panda.creature: "パンダ"
pet.snow_panda.habitat: "雪の竹山"
pet.snow_panda.story: "氷の毛を持つ眠たげなパンダ。穏やかですが、凍った前足は氷河が落ちるような一撃です。"
pet.spark_hamster: "火花ハムスター"
pet.spark_hamster.creature: "ハムスター"
pet.spark_hamster.habitat: "工房の屋根"
pet.spark_hamster.story: "静電気だらけの小さなハムスター。輪を描いて走ると灯籠を丸ごと灯せます。"
pet.spirit_monkey: "霊猿"
pet.spirit_monkey.creature: "猿"
pet.spirit_monkey.habitat: "霧の神殿跡"
pet.spirit_monkey.story: "帽子も笑いも盗むいたずらな幽霊猿。退屈すると壁をすり抜けます。"
pet.star_octopus: "星ダコ"
pet.star_octopus.creature: "タコ"
pet.star_octopus.habitat: "星の下の深海"
pet.star_octopus.story: "腕ごとに小さな銀河を宿しています。遠い昔に空から落ちてきたと言われます。"
pet.steel_scorpion: "鋼サソリ"
pet.steel_scorpion.creature: "サソリ"
pet.steel_scorpion.habitat: "古戦場とくず鉄置き場"
pet.steel_scorpion.story: "鎧のような体で錆びた武器の間を狩ります。尾は板金も布のように貫きます。"
pet.storm_eel: "嵐ウナギ"
pet.storm_eel.creature: "ウナギ"
pet.storm_eel.habitat: "嵐の湾"
pet.storm_eel.story: "長い体に雷を蓄え、まばゆい閃光として放ちます。漁師はその水域を避けます。"
pet.stormbird: "嵐鳥"
pet.stormbird.creature: "鷲"
pet.stormbird.habitat: "雲上の雷の峰"
pet.stormbird.story: "嵐の中で生まれた鷲。羽ばたくたびに放電し、落雷のように急降下します。"
pet.sun_scorpion: "太陽サソリ"
pet.sun_scorpion.creature: "サソリ"
pet.sun_scorpion.habitat: "砂漠の太陽神殿"
pet.sun_scorpion.story: "日光を飲む黄金のサソリ。正午には針が炎より明るく燃えます。"
pet.swamp_frog: "沼ガエル"
pet.swamp_frog.creature: "カエル"
pet.swamp_frog.habitat: "濁った沼"
pet.swamp_frog.story: "とても鋭い舌を持つ怠け者のカエル。皮膚からは触れたものを痺れさせる毒がにじみます。"
pet.thorn_hedgehog: "茨ハリネズミ"
pet.thorn_hedgehog.creature: "ハリネズミ"
pet.thorn_hedgehog.habitat: "岩の丘と茨の茂み"
pet.thorn_hedgehog.story: "小さくても勇敢で、石のとげの玉に丸まります。叩いた者は後悔します。"
pet.time_caterpillar: "時の芋虫"
pet.time_caterpillar.creature: "芋虫の蛾"
pet.time_caterpillar.habitat: "時が止まった遺跡"
pet.time_caterpillar.story: "葉の代わりに瞬間をかじります。繭は周りすべての時間を遅くできます。"
pet.venom_moth: "毒翅チョウ"
pet.venom_moth.creature: "チョウ"
pet.venom_moth.habitat: "毒の湿地の庭"
pet.venom_moth.story: "美しくも致命的で、羽から散る光る粉は吸った敵を弱らせます。"
pet.venom_spider: "毒グモ"
pet.venom_spider.creature: "クモ"
pet.venom_spider.habitat: "蜘蛛の巣の密林洞窟"
pet.venom_spider.story: "大きな獣さえ捕らえる光る巣を編みます。ひと噛みで獲物の力を奪います。"
pet.wheat_boar: "麦イノシシ"
pet.wheat_boar.creature: "イノシシ"
pet.wheat_boar.habitat: "黄金の農地"
pet.wheat_boar.story: "農夫に歓迎され、歩いた畑は倍に育ちます。黄金の毛は収穫期に輝きます。"

