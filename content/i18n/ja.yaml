pet.chaos_hydra: "混沌ヒュドラ"
pet.chaos_hydra.creature: "ヒュドラ"
pet.chaos_hydra.habitat: "永遠の果ての廃神殿"
pet.chaos_hydra.story: "世界の果てで生まれた多頭の生き物。頭ごとに異なる混沌の風を糧とし、主と結ばれると複数の方向から同時に敵を襲います。"
pet.cloud_sheep: "雲羊"
pet.cloud_sheep.creature: "羊"
pet.cloud_sheep.habitat: "浮遊する空の島"
pet.cloud_sheep.story: "毛は本物の雲で、柔らかく軽やかです。穏やかな日には草原の上に浮かびます。"
pet.coral_snake: "珊瑚ヘビ"
pet.coral_snake.creature: "ヘビ"
pet.coral_snake.habitat: "深い礁と沈んだ遺跡"
pet.coral_snake.story: "沈んだ財宝を守る珊瑚模様のヘビ。とぐろは礁そのもののように硬いです。"
pet.cosmic_whale: "宇宙クジラ"
pet.cosmic_whale.creature: "クジラ"
pet.cosmic_whale.habitat: "雲間の星の海"
pet.cosmic_whale.story: "夜空を泳ぐ穏やかな巨人。星々がきらめく泡のように肌に付きます。"
pet.crimson_lion: "真紅の獅子"
pet.crimson_lion.creature: "獅子"
pet.crimson_lion.habitat: "黄金のサバンナ"
pet.crimson_lion.story: "夕日のようなたてがみの誇り高き獅子。咆哮は近くの味方すべてに勇気を与えます。"
pet.crystal_cat: "水晶猫"
pet.crystal_cat.creature: "猫"
pet.crystal_cat.habitat: "水晶の洞窟"
pet.crystal_cat.story: "透明な水晶の体を持つ好奇心旺盛な猫。光が屈折し、二か所に同時にいるように見えます。"
pet.deluge_shark: "大洪水ザメ"
pet.deluge_shark.creature: "サメ"
pet.deluge_shark.habitat: "嵐の外海"
pet.deluge_shark.story: "大波に乗り、嵐の中を泳ぎます。ひれが水面を割ると船が揺れます。"
pet.diamond_beetle: "ダイヤモンドカブト"
pet.diamond_beetle.creature: "カブトムシ"
pet.diamond_beetle.habitat: "宝石の鉱山"
pet.diamond_beetle.story: "甲羅は傷ひとつないダイヤモンドです。岩を掘り進み、見つけた宝石を食べます。"
pet.ember_hyena: "残り火ハイエナ"
pet.ember_hyena.creature: "ハイエナ"
pet.ember_hyena.habitat: "焼けた平原と灰の野"
pet.ember_hyena.story: "周りの草が燃えるのを見て笑います。背筋に沿って燃えさしが光ります。"
pet.emerald_peacock: "エメラルドクジャク"
pet.emerald_peacock.creature: "クジャク"
pet.emerald_peacock.habitat: "王家の庭園と密林の神殿"
pet.emerald_peacock.story: "エメラルドの尾を広げると周りに花が咲きます。かつて王たちは幸運の印として飼いました。"
pet.fairy_firefly: "妖精ホタル"
pet.fairy_firefly.creature: "ホタルの妖精"
pet.fairy_firefly.habitat: "魔法の夜の森"
pet.fairy_firefly.story: "ホタルのように光る小さな妖精。踊る場所では最も暗い夜も優しくなります。"
pet.flame_salamander: "炎のサラマンダー"
pet.flame_salamander.creature: "サラマンダー"
pet.flame_salamander.habitat: "鍛冶の炎と溶岩洞"
pet.flame_salamander.story: "鍛冶師は、サラマンダーが眠る炉が最もよく燃えると言います。冬でも決して冷えません。"
pet.flamewing: "炎翼"
pet.flamewing.creature: "不死鳥のような鳥"
pet.flamewing.habitat: "火口の縁と残り火の空"
pet.flamewing.story: "光り続ける小さな火の鳥。成長すると、飛んだ跡に火花の筋を残します。"
pet.frostwolf: "霜狼"
pet.frostwolf.creature: "狼"
pet.frostwolf.habitat: "凍ったツンドラと雪の森"
pet.frostwolf.story: "息が霜に変わる忠実な群れの狩人。吹雪の中でも遠くの獲物を追えます。"
pet.gale_owl: "疾風フクロウ"
pet.gale_owl.creature: "フクロウ"
pet.gale_owl.habitat: "風の崖と高い塔"
pet.gale_owl.story: "音もなく風に乗る賢いフクロウ。敵の動きを起こる前に見抜きます。"
pet.glass_jellyfish: "ガラスクラゲ"
pet.glass_jellyfish.creature: "クラゲ"
pet.glass_jellyfish.habitat: "月明かりの潟"
pet.glass_jellyfish.story: "水中でほとんど見えず、ガラスの灯籠のように漂います。触れると味方を癒し敵を刺します。"
pet.graveyard_owl: "墓地フクロウ"
pet.graveyard_owl.creature: "フクロウ"
pet.graveyard_owl.habitat: "古い墓地"
pet.graveyard_owl.story: "眠る死者を見守ります。青緑の目は誰にも見えない霊を見ます。"
