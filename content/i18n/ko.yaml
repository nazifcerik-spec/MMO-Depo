pet.aurora_reindeer: "오로라 순록"
pet.aurora_reindeer.creature: "순록"
pet.aurora_reindeer.habitat: "오로라 아래의 극야"
pet.aurora_reindeer.story: "뿔이 북극광의 빛깔로 빛납니다. 무리는 가장 긴 밤에도 그 뒤를 따릅니다."
pet.autumn_stag: "가을 사슴 정령"
pet.autumn_stag.creature: "나뭇잎 사슴"
pet.autumn_stag.habitat: "가을 숲"
pet.autumn_stag.story: "떨어지는 잎의 정령. 걷는 곳마다 숲이 붉고 금빛으로 물듭니다."
pet.bone_dragon: "해골 용"
pet.bone_dragon.creature: "해골 용"
pet.bone_dragon.habitat: "잊힌 전장"
pet.bone_dragon.story: "자신의 뼈에서 되살아난 고대의 용. 쓰러진 병사를 일으켜 곁에서 싸우게 합니다."
pet.chaos_hydra: "혼돈 히드라"
pet.chaos_hydra.creature: "히드라"
pet.chaos_hydra.habitat: "영원의 끝에 있는 폐허 신전"
pet.chaos_hydra.story: "세상이 끝나는 곳에서 태어난 머리 많은 생물. 머리마다 다른 혼돈의 바람을 먹으며, 주인과 맺어지면 여러 방향에서 동시에 적을 공격합니다."
pet.cloud_sheep: "구름 양"
pet.cloud_sheep.creature: "양"
pet.cloud_sheep.habitat: "떠도는 하늘 섬"
pet.cloud_sheep.story: "털이 진짜 구름처럼 부드럽고 가볍습니다. 고요한 날이면 초원 위를 떠다닙니다."
pet.coral_snake: "산호 뱀"
pet.coral_snake.creature: "뱀"
pet.coral_snake.habitat: "깊은 암초와 가라앉은 폐허"
pet.coral_snake.story: "가라앉은 보물을 지키는 산호 무늬 뱀. 똬리는 암초만큼 단단합니다."
pet.cosmic_whale: "우주 고래"
pet.cosmic_whale.creature: "고래"
pet.cosmic_whale.habitat: "구름 사이의 별바다"
pet.cosmic_whale.story: "밤하늘을 헤엄치는 온순한 거인. 별들이 반짝이는 거품처럼 피부에 달라붙습니다."
pet.crimson_lion: "진홍 사자"
pet.crimson_lion.creature: "사자"
pet.crimson_lion.habitat: "황금빛 사바나"
pet.crimson_lion.story: "노을 같은 갈기를 지닌 당당한 사자. 포효는 곁의 모든 아군에게 용기를 줍니다."
pet.crystal_cat: "수정 고양이"
pet.crystal_cat.creature: "고양이"
pet.crystal_cat.habitat: "수정 동굴"
pet.crystal_cat.story: "맑은 수정 몸을 가진 호기심 많은 고양이. 빛이 굴절되어 두 곳에 동시에 있는 듯 보입니다."
pet.deluge_shark: "대홍수 상어"
pet.deluge_shark.creature: "상어"
pet.deluge_shark.habitat: "폭풍 치는 넓은 바다"
pet.deluge_shark.story: "거대한 파도를 타며 폭풍 속을 헤엄칩니다. 지느러미가 수면을 가르면 배들이 흔들립니다."
pet.diamond_beetle: "다이아몬드 딱정벌레"
pet.diamond_beetle.creature: "장수풍뎅이"
pet.diamond_beetle.habitat: "보석 광산"
pet.diamond_beetle.story: "등껍질은 흠 없는 다이아몬드 하나입니다. 바위를 파고들며 찾아낸 보석을 먹습니다."
pet.ember_hyena: "불씨 하이에나"
pet.ember_hyena.creature: "하이에나"
pet.ember_hyena.habitat: "불탄 평원과 재의 들판"
pet.ember_hyena.story: "주변의 풀이 타는 동안 웃습니다. 등줄기를 따라 불씨가 타오릅니다."
pet.emerald_peacock: "에메랄드 공작"
pet.emerald_peacock.creature: "공작"
pet.emerald_peacock.habitat: "왕실 정원과 밀림 신전"
pet.emerald_peacock.story: "에메랄드 꼬리를 펼치면 주위에 꽃이 핍니다. 옛 왕들은 행운의 상징으로 길렀습니다."
pet.fairy_firefly: "요정 반딧불이"
pet.fairy_firefly.creature: "반딧불이 요정"
pet.fairy_firefly.habitat: "마법에 걸린 밤의 숲"
pet.fairy_firefly.story: "반딧불이처럼 빛나는 작은 요정. 춤추는 곳마다 가장 어두운 밤도 부드러워집니다."
pet.flame_salamander: "화염 도롱뇽"
pet.flame_salamander.creature: "도롱뇽"
pet.flame_salamander.habitat: "대장간 불과 용암 동굴"
pet.flame_salamander.story: "대장장이들은 도롱뇽이 잠든 화로가 가장 잘 탄다고 말합니다. 겨울에도 결코 차가워지지 않습니다."
pet.flamewing: "불꽃날개"
pet.flamewing.creature: "불사조 같은 새"
pet.flamewing.habitat: "화산 가장자리와 불씨 하늘"
pet.flamewing.story: "빛을 멈추지 않는 작은 불새. 자라면 날갯짓마다 불꽃 자취를 남깁니다."
pet.frostwolf: "서리 늑대"
pet.frostwolf.creature: "늑대"
pet.frostwolf.habitat: "얼어붙은 툰드라와 눈 숲"
pet.frostwolf.story: "숨결이 서리로 변하는 충직한 무리 사냥꾼. 눈보라 속에서도 먼 거리의 사냥감을 쫓습니다."
pet.gale_owl: "돌풍 올빼미"
pet.gale_owl.creature: "올빼미"
pet.gale_owl.habitat: "바람 부는 절벽과 높은 탑"
pet.gale_owl.story: "소리 없이 바람을 타는 지혜로운 올빼미. 적의 움직임을 먼저 내다봅니다."
pet.glass_jellyfish: "유리 해파리"
pet.glass_jellyfish.creature: "해파리"
pet.glass_jellyfish.habitat: "달빛 석호"
pet.glass_jellyfish.story: "물속에서 거의 보이지 않고 유리 등불처럼 떠다닙니다. 손길은 친구를 치유하고 적을 찌릅니다."
pet.graveyard_owl: "묘지 올빼미"
pet.graveyard_owl.creature: "올빼미"
pet.graveyard_owl.habitat: "오래된 묘지"
pet.graveyard_owl.story: "잠든 망자를 지켜봅니다. 청록빛 눈은 다른 이가 보지 못하는 영혼을 봅니다."
pet.iron_bull: "철 황소"
pet.iron_bull.creature: "황소"
pet.iron_bull.habitat: "산악 광산과 대장간"
pet.iron_bull.story: "살아있는 철 가죽을 지닌 황소. 돌진을 시작하면 왕국의 어떤 성문도 막지 못합니다."
pet.lava_crab: "용암 게"
pet.lava_crab.creature: "게"
pet.lava_crab.habitat: "용암 해안과 온천"
pet.lava_crab.story: "등껍질은 식은 용암이고 집게는 아직 붉게 빛납니다. 아무것도 살 수 없는 곳에서 즐겁게 목욕합니다."
pet.light_stag: "빛사슴"
pet.light_stag.creature: "사슴"
pet.light_stag.habitat: "햇살 가득한 숲속 빈터와 성스러운 숲"
pet.light_stag.story: "새벽처럼 빛나는 뿔을 지닌 찬란한 사슴. 길 잃은 나그네는 그 빛을 따라 안전한 길로 돌아옵니다."
pet.mossback: "이끼등"
pet.mossback.creature: "나무 등껍질 거북"
pet.mossback.habitat: "오래된 숲과 이끼 낀 강둑"
pet.mossback.story: "등에 살아있는 나무를 지닌 인내심 많은 거북. 숲을 천천히 거니는 동안 가지에 새들이 둥지를 틉니다."
pet.mushroom_squirrel: "버섯 다람쥐"
pet.mushroom_squirrel.creature: "다람쥐"
pet.mushroom_squirrel.habitat: "버섯 숲"
pet.mushroom_squirrel.story: "꼬리에 버섯이 자라는 작은 다람쥐. 씨앗을 곳곳에 숨기고 절반은 잊어버립니다."
pet.night_bat: "밤 박쥐"
pet.night_bat.creature: "박쥐"
pet.night_bat.habitat: "깊은 동굴"
pet.night_bat.story: "밤하늘의 조용한 사냥꾼. 동굴 건너편의 심장 소리까지 듣습니다."
pet.obsidian_frog: "흑요석 개구리"
pet.obsidian_frog.creature: "개구리"
pet.obsidian_frog.habitat: "화산 웅덩이"
pet.obsidian_frog.story: "녹은 핏줄이 흐르는 검은 화산 유리 개구리. 화상 없이 용암 웅덩이 사이를 뛰어다닙니다."
pet.rainbow_parrot: "무지개 앵무새"
pet.rainbow_parrot.creature: "앵무새"
pet.rainbow_parrot.habitat: "열대 수관"
pet.rainbow_parrot.story: "깃털에 하늘의 모든 색을 지닌 수다쟁이 앵무새. 들은 소리는 무엇이든 따라 합니다."
pet.rune_golem: "룬 골렘"
pet.rune_golem.creature: "돌 골렘"
pet.rune_golem.habitat: "고대 마법사의 탑"
pet.rune_golem.story: "잊힌 마법사들이 깎아 만들었으며 룬이 푸르게 빛나면 깨어납니다. 믿는 이에게만 복종합니다."
pet.rust_wolf: "녹슨 기계 늑대"
pet.rust_wolf.creature: "기계 늑대"
pet.rust_wolf.habitat: "버려진 공방"
pet.rust_wolf.story: "사라진 발명가가 만든 태엽 늑대. 녹으로 덮였지만 톱니는 여전히 충성스럽게 돕니다."
pet.sand_drake: "모래 드레이크"
pet.sand_drake.creature: "용 도마뱀"
pet.sand_drake.habitat: "모래 언덕의 바다와 사막 협곡"
pet.sand_drake.story: "물처럼 모래 속을 헤엄치는 태양을 사랑하는 드레이크. 청동 비늘은 칼날을 튕겨 냅니다."
pet.sand_tiger: "모래 호랑이"
pet.sand_tiger.creature: "호랑이"
pet.sand_tiger.habitat: "사막 폐허"
pet.sand_tiger.story: "줄무늬 털이 모래 언덕에 녹아듭니다. 몇 시간을 기다렸다가 단번에 덮칩니다."
pet.sea_horn: "바다뿔"
pet.sea_horn.creature: "해마 용"
pet.sea_horn.habitat: "산호초와 따뜻한 얕은 바다"
pet.sea_horn.story: "나선형 뿔을 지닌 우아한 바다 용. 선원들은 그 노래가 가장 거친 파도도 잠재운다고 합니다."
pet.seal_dragon: "봉인된 용"
pet.seal_dragon.creature: "동양의 용"
pet.seal_dragon.habitat: "봉인된 산속 사당"
pet.seal_dragon.story: "한때 천 개의 봉인에 묶였으나, 이제는 그것을 깰 자격이 있는 이를 섬깁니다."
pet.shadefox: "그림자 여우"
pet.shadefox.creature: "여우"
pet.shadefox.habitat: "달 없는 숲과 오래된 폐허"
pet.shadefox.story: "그림자 사이를 빠져나가는 영리한 여우. 나그네는 이미 사라진 뒤에야 알아챕니다."
pet.silvermoon_hare: "은월 토끼"
pet.silvermoon_hare.creature: "토끼"
pet.silvermoon_hare.habitat: "달빛 초원"
pet.silvermoon_hare.story: "보름달에만 나타나는 재빠른 토끼. 은빛 털은 주인에게 행운을 가져다준다고 합니다."
pet.snow_panda: "눈 판다"
pet.snow_panda.creature: "판다"
pet.snow_panda.habitat: "눈 덮인 대나무 산"
pet.snow_panda.story: "얼음 털을 지닌 졸린 판다. 온순하지만 얼어붙은 앞발은 빙하가 떨어지듯 강력합니다."
pet.spark_hamster: "불꽃 햄스터"
pet.spark_hamster.creature: "햄스터"
pet.spark_hamster.habitat: "공방 지붕"
pet.spark_hamster.story: "정전기로 가득한 작은 햄스터. 원을 그리며 달리면 등불 하나를 밝힐 수 있습니다."
pet.spirit_monkey: "정령 원숭이"
pet.spirit_monkey.creature: "원숭이"
pet.spirit_monkey.habitat: "안개 낀 신전 폐허"
pet.spirit_monkey.story: "모자와 웃음을 함께 훔치는 장난꾸러기 유령 원숭이. 심심하면 벽을 통과합니다."
pet.star_octopus: "별 문어"
pet.star_octopus.creature: "문어"
pet.star_octopus.habitat: "별빛 아래의 심해"
pet.star_octopus.story: "다리마다 작은 은하를 품고 있습니다. 오래전 하늘에서 떨어졌다고 전해집니다."
pet.steel_scorpion: "강철 전갈"
pet.steel_scorpion.creature: "전갈"
pet.steel_scorpion.habitat: "오래된 전장과 고철장"
pet.steel_scorpion.story: "갑옷처럼 생겨 녹슨 무기들 사이에서 사냥합니다. 꼬리는 판금을 천처럼 쉽게 뚫습니다."
pet.storm_eel: "폭풍 장어"
pet.storm_eel.creature: "장어"
pet.storm_eel.habitat: "폭풍 치는 만"
pet.storm_eel.story: "긴 몸에 번개를 저장했다가 눈부신 섬광으로 내뿜습니다. 어부들은 그 물을 피합니다."
pet.stormbird: "폭풍새"
pet.stormbird.creature: "독수리"
pet.stormbird.habitat: "구름 위의 천둥 봉우리"
pet.stormbird.story: "폭풍 속에서 태어난 독수리. 날갯짓마다 전기가 튀고, 떨어지는 번개처럼 내리꽂습니다."
pet.sun_scorpion: "태양 전갈"
pet.sun_scorpion.creature: "전갈"
pet.sun_scorpion.habitat: "사막의 태양 신전"
pet.sun_scorpion.story: "햇빛을 마시는 황금 전갈. 한낮이면 독침이 불보다 밝게 타오릅니다."
pet.swamp_frog: "늪 개구리"
pet.swamp_frog.creature: "개구리"
pet.swamp_frog.habitat: "탁한 늪"
pet.swamp_frog.story: "혀가 아주 날카로운 게으른 개구리. 피부에서 닿는 것을 마비시키는 독이 스며 나옵니다."
pet.thorn_hedgehog: "가시 고슴도치"
pet.thorn_hedgehog.creature: "고슴도치"
pet.thorn_hedgehog.habitat: "바위 언덕과 가시덤불"
pet.thorn_hedgehog.story: "작지만 용감하며 돌가시 공으로 몸을 맙니다. 때리는 자는 누구든 후회합니다."
pet.time_caterpillar: "시간 애벌레"
pet.time_caterpillar.creature: "애벌레 나방"
pet.time_caterpillar.habitat: "시간이 멈춘 폐허"
pet.time_caterpillar.story: "잎 대신 순간을 갉아 먹습니다. 고치는 주변 모두의 시간을 늦출 수 있습니다."
pet.venom_moth: "독날개 나비"
pet.venom_moth.creature: "나비"
pet.venom_moth.habitat: "독성 습지 정원"
pet.venom_moth.story: "아름답지만 치명적이며, 날개에서 흩뿌리는 빛나는 가루는 들이마신 적을 약화시킵니다."
pet.venom_spider: "독거미"
pet.venom_spider.creature: "거미"
pet.venom_spider.habitat: "거미줄 덮인 밀림 동굴"
pet.venom_spider.story: "큰 짐승도 가두는 빛나는 거미줄을 짭니다. 한 번 물면 사냥감의 힘을 빼앗습니다."
pet.wheat_boar: "밀밭 멧돼지"
pet.wheat_boar.creature: "멧돼지"
pet.wheat_boar.habitat: "황금빛 농지"
pet.wheat_boar.story: "농부들이 반기는 존재로, 지나간 밭은 두 배로 자랍니다. 황금빛 털은 수확철에 빛납니다."

