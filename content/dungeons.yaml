# Otter — Dungeon Template Catalog (Sprint 15)
#
# Alan sözleşmesi (content.dungeon_template):
#   code               PK, snake_case
#   display_name_key   i18n key
#   min_level          karakterin min seviyesi
#   duration_seconds   run süresi (reveal öncesi geçmesi gereken süre)
#   waves              [{mob_code, count}, …] sıralı
#   boss_mob_code      final encounter
#   bonus_gold_copper  boss kill ekstra gold
#   bonus_xp           boss kill ekstra xp

dungeons:
  - code: crypt_of_ashes
    display_name_key: dungeon.crypt_of_ashes
    min_level: 6
    duration_seconds: 900         # 15 minutes
    waves:
      - { mob_code: grey_wolf,    count: 3 }
      - { mob_code: bandit_scout, count: 3 }
      - { mob_code: cave_bat,     count: 3 }
    boss_mob_code: goblin_raider
    bonus_gold_copper: 250
    bonus_xp: 300

  - code: forest_hollow
    display_name_key: dungeon.forest_hollow
    min_level: 11
    duration_seconds: 1200        # 20 minutes
    waves:
      - { mob_code: goblin_raider,  count: 3 }
      - { mob_code: marsh_lurker,   count: 3 }
      - { mob_code: forest_troll,   count: 2 }
    boss_mob_code: dire_wolf
    bonus_gold_copper: 700
    bonus_xp: 1200

  - code: shadowfen_ruins
    display_name_key: dungeon.shadowfen_ruins
    min_level: 17
    duration_seconds: 1800        # 30 minutes
    waves:
      - { mob_code: dire_wolf,       count: 3 }
      - { mob_code: cultist_acolyte, count: 3 }
      - { mob_code: rock_ogre,       count: 2 }
    boss_mob_code: shadow_stalker
    bonus_gold_copper: 2500
    bonus_xp: 4000

  - code: obsidian_spire
    display_name_key: dungeon.obsidian_spire
    min_level: 23
    duration_seconds: 2400        # 40 minutes
    waves:
      - { mob_code: shadow_stalker, count: 3 }
      - { mob_code: frost_giant,    count: 3 }
      - { mob_code: elder_wyrm,     count: 1 }
    boss_mob_code: ashen_lich
    bonus_gold_copper: 5000
    bonus_xp: 9000
