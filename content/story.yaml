# Story mode (DD-313, DD-367). The full text: docs/story/. Scene text:
# content/story/<lang>/*.yaml, one file per chapter (en + tr complete; other
# languages fall back to en key by key).
#
# chapters: code + min_level (titles: content/i18n story.<code>, .body)
# scenes, read in this order:
#   code, chapter, min_level        min_level never drops along the list
#   when: {flag: a|b, flag: "!a", counter: ">=8"}
#                                   shown only when it holds (else skipped)
#   quests: [..]                    story quests to turn in before passing
#   optional_quests: [..]           offered alongside (an option may need one)
#   after: true                     has a text shown once the quests are in
#   extras: [{key, when, race, after}]
#                                   extra paragraph when it holds; after: below
#                                   the quests
#   options: [{code, set: {flag: v}, add: {counter: n}, when, requires_quest,
#              reputation: {faction: n}}]
#                                   the choice; none visible = "continue"
# Text keys per scene: <code> (title), <code>.body, <code>.after,
# <code>.x.<extra>, <code>.<option> (label), <code>.<option>.result.
# Flags and counters: docs/story/README.md.
#
# quests: story quests (category story), written by
# scripts/gen_story_quests.py; the quest board offers each one only while its
# scene is current.

chapters:
  - code: prologue
    min_level: 1
  - code: chapter_1
    min_level: 2
    requires: prologue
  - code: chapter_2
    min_level: 100
    requires: chapter_1
  - code: chapter_3
    min_level: 300
    requires: chapter_2
  - code: chapter_4
    min_level: 600
    requires: chapter_3
  - code: chapter_5
    min_level: 700
    requires: chapter_4
  - code: chapter_6
    min_level: 850
    requires: chapter_5
  - code: endings
    min_level: 1000
    requires: chapter_6

