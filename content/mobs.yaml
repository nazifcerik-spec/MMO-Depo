# Otter — Mob Template Catalog (Sprint 13 — Combat)
#
# Alan sözleşmesi (content.mob_template):
#   code               PK, snake_case, immutable
#   display_name_key   i18n key
#   level              1..N (dünya bölge skalası; Sprint 16'da region eşleşmesi)
#   hp_max             maksimum can pool
#   attack             base attack damage
#   defense            saldırıdan düşülen ham (attack - defense × 0.5)
#   crit_pct           kritik şansı (0..100)
#   hit_pct            base to-hit; player evasion çıkarılır (min 15, max 95)
#   evasion_pct        gelen attacker'ın hit_pct'inden düşülür
#   xp_reward          kill başına verilen XP
#   gold_copper_min    kill başına gold aralığı (min, max) — copper
#   gold_copper_max
#
# Balance (DD-229): stats come from one level curve (hp 150+25L, attack
# 28+2.1L, defense 1+0.8L, xp 10·L^1.6) × archetype (tank/glass/evasive/crit),
# tuned with the balance simulation (server/internal/balance).

