# Class skills v1 (Sprint 42, DD-222). docs/skill-engine/*, docs/class/*.
#
#   kind           active (savaşta otomatik) | passive (sheet modifier)
#   unlock_level   karakter bu seviyede otomatik açar (öğrenme/respec yok v1)
#   sort_order     aktifler: kullanım önceliği (küçük önce)
#   effect         strike: hasar × power/100 (normal isabet/kritik zarı)
#                  heal:   HP max'ın power%'i kadar iyileştirme; yalnız HP <= %50
#   mp_cost        her karşılaşma MP dolu başlar (MP = 50 + INT×5)
#   cooldown_turns tekrar kullanılabilmesi için geçmesi gereken tur
#   modifiers      pasifler: DD-107 stack (flat | mult_add | mult_prod), hedefler
#                  str/agi/int/vit/cha/luck, attack/defense/crit_pct/hit_pct,
#                  hp_max/mp_max/energy_max/stamina_max

skills:
  # --- Warrior (DD-250) --------------------------------------------------------
