# Otter — Profession Catalog (Sprint 17)
#
# code            PK, snake_case
# display_name_key i18n key
# max_level       max meslek seviyesi (skill cap)
#
# Meslek seviyesi 1-100 = karakter seviyesi 1-1000 (DD-274): Sv L ekipmanın
# tarifi ceil(L/10) beceri ister (scripts/gen_crafting.py).

professions:
  - code: blacksmithing # plate armor + metal weapons
    display_name_key: profession.blacksmithing
    max_level: 100

  - code: leatherworking # leather armor (DD-274)
    display_name_key: profession.leatherworking
    max_level: 100

  - code: tailoring # cloth armor + holy tomes (DD-274)
    display_name_key: profession.tailoring
    max_level: 100

  - code: woodworking # staves, wands, bows, lutes, totems (DD-274)
    display_name_key: profession.woodworking
    max_level: 100

  - code: jewelcrafting # necklaces, rings, charms (DD-276)
    display_name_key: profession.jewelcrafting
    max_level: 100

  - code: alchemy
    display_name_key: profession.alchemy
    max_level: 100

  - code: cooking
    display_name_key: profession.cooking
    max_level: 100 # dishes up to fishing level 100 (DD-268)

  - code: smelting # ore + coal → bar (DD-243)
    display_name_key: profession.smelting
    max_level: 100

  # Gathering professions (DD-244): levelled by gathering, never learned.
  - code: hunting
    display_name_key: profession.hunting
    kind: gathering
    max_level: 100

  - code: herbalism
    display_name_key: profession.herbalism
    kind: gathering
    max_level: 100

  - code: woodcutting
    display_name_key: profession.woodcutting
    kind: gathering
    max_level: 100

  - code: fishing
    display_name_key: profession.fishing
    kind: gathering
    max_level: 100

  - code: mining
    display_name_key: profession.mining
    kind: gathering
    max_level: 100
