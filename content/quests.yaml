# Quests v1 (Sprint 41, DD-221). docs/quests/*.
#
#   category        main (sıralı zincir) | side (opsiyonel) | daily (günlük havuz)
#   requires_quest  önce teslim edilmesi gereken görev (main zinciri)
#   objectives      progression olay türleri:
#                     mob_killed, mob_killed:<mob>, boss_killed,
#                     dungeon_cleared, dungeon_cleared:<dungeon>,
#                     gather_<mining|fishing|woodcutting|herbalism|hunting>,
#                     item_crafted, item_crafted:<item>
#   reward_*        teslimde: XP + altın (ledger, idempotent)
#
# Görev ilerlemesi kabulden sonra başlar (geriye dönük sayılmaz). Günlükler
# her karakter için UTC gün başında havuzdan 3 tane (seviyeye uygun) seçilir.

quests:
  # --- Main chain ----------------------------------------------------------
  - code: main_01_first_hunt
    display_name_key: quest.main_01_first_hunt
    category: main
    min_level: 1
    objectives:
      - { event: "mob_killed:young_boar", count: 5 }
    reward_xp: 80
    reward_gold_copper: 200
    sort_order: 10

  - code: main_02_supplies
