# Otter — Recipe Catalog (Sprint 17)
#
# Alan sözleşmesi:
#   code                  PK, snake_case
#   display_name_key      i18n key
#   profession_code       hangi meslek gerekli
#   min_skill             minimum meslek seviyesi
#   inputs                [{template_code, quantity}, ...] — hepsi consume edilir
#   gold_cost_copper      craft başına harcanan gold (0 olabilir)
#   output_template_code  üretilen item template
#   output_stack          üretilen stack miktarı
#   profession_xp_reward  başarılı craft'ta verilen meslek XP'si
#   craft_seconds         birim başı üretim süresi (DD-264)

