# Gathering tables (DD-244), from the design sheet (Book.xlsx): five
# gathering professions, 30 resources each, tier T0..T7 and the gathering
# level (1..100) that unlocks them. The player picks a resource when
# starting; its tier sets the colour (T0-1 common, T2-3 uncommon, T4 rare,
# T5 epic, T6 legendary, T7 mythic) and how fast it is gathered.
# Value = 2 x 1.06^level copper. Codes are unique across items/gear/gathering.

items:

